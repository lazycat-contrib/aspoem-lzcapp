lzc-sdk-version: "0.1"
name: AsPoem
package: cloud.lazycat.app.aspoem
version: 0.0.1
description: 现代化诗词学习网站，一个更加注重 UI和阅读体验 的诗词网站。
homepage: https://github.com/meetqy/aspoem
author: meetqy
application:
  subdomain: aspoem
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://aspoem:3000/
services:
  aspoem:
    image: docker.hlmirror.com/mmmhaha85/aspoem:adb9250a1
    environment:
      - POSTGRES_PRISMA_URL=postgresql://postgres:postgres@postgres:5432/aspoem
      - POSTGRES_URL_NON_POOLING=postgresql://postgres:postgres@postgres:5432/aspoem
      - TOKEN=lazycat
      - NEXT_PUBLIC_GA_ID=xx
      - NEXT_PUBLIC_MC_ID=xx
    depends_on:
      - postgres
  postgres:
    image: docker.hlmirror.com/postgres:16.2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aspoem
    binds:
      - /lzcapp/var/db:/var/lib/postgresql/data
    health_check:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      start_period: 90s