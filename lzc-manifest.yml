application:
  subdomain: aspoem
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://aspoem:3000/
services:
  aspoem:
    # upstream: mmmhaha85/aspoem:adb9250a1@sha256:fe8da160b5b33bef8bd4e80aee92c02c204c6f68058d9d9345d00b1050347f7a
    image: registry.lazycat.cloud/czyt/mmmhaha85/aspoem:cdb228662894876c
    environment:
      - POSTGRES_PRISMA_URL=postgresql://postgres:{{ stable_secret "aspoem_db_password" }}@postgres:5432/aspoem
      - POSTGRES_URL_NON_POOLING=postgresql://postgres:{{ stable_secret "aspoem_db_password" }}@postgres:5432/aspoem
      - TOKEN={{ stable_secret "aspoem_token" }}
      - NEXT_PUBLIC_GA_ID=xx
      - NEXT_PUBLIC_MC_ID=xx
    depends_on:
      - postgres
  postgres:
    # upstream: library/postgres:16.16
    image: registry.lazycat.cloud/czyt/library/postgres:815e486d31346369
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD={{ stable_secret "aspoem_db_password" }}
      - POSTGRES_DB=aspoem
    binds:
      - /lzcapp/var/db:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      start_period: 90s
